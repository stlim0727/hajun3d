<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hajun Plane 3D - GLB 모델 갤러리 & 뷰어</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1b2a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    .viewer-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Top Header */
    .viewer-header {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
      z-index: 20;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #e0f2fe;
      white-space: nowrap;
    }

    .hdr-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.85);
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .hdr-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .hdr-btn.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: rgba(56, 189, 248, 0.7);
      color: #ffffff;
    }

    .hdr-btn.back {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: rgba(16, 185, 129, 0.7);
      color: #ffffff;
    }

    .mobile-only-btn {
      display: none;
    }

    /* Main Split Layout */
    .viewer-main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* Sidebar Catalog */
    .viewer-sidebar {
      width: 310px;
      background: rgba(15, 23, 42, 0.86);
      border-right: 1px solid rgba(56, 189, 248, 0.22);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      z-index: 15;
      flex-shrink: 0;
    }

    .sidebar-controls {
      padding: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .viewer-search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .viewer-search:focus {
      border-color: #38bdf8;
    }

    .viewer-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .viewer-tab-btn {
      padding: 6px 4px;
      border-radius: 7px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .viewer-tab-btn.active {
      background: rgba(14, 165, 233, 0.25);
      border-color: #38bdf8;
      color: #e0f2fe;
    }

    .viewer-model-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewer-model-card {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(30, 41, 59, 0.65);
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .viewer-model-card:hover {
      background: rgba(51, 65, 85, 0.85);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .viewer-model-card.active {
      background: rgba(14, 165, 233, 0.22);
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
    }

    .card-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title-row strong {
      font-size: 13px;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .card-badge.bundled {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .card-badge.external {
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .card-body small {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
    }

    .viewer-empty {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      padding: 24px 10px;
    }

    /* 3D Canvas Viewport */
    .viewer-canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .viewer-canvas-wrap:active {
      cursor: grabbing;
    }

    /* Model Info Overlay */
    .viewer-info-card {
      position: absolute;
      top: 14px;
      left: 14px;
      max-width: 310px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.74);
      border: 1px solid rgba(56, 189, 248, 0.28);
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 10;
    }

    .viewer-info-card h2 {
      font-size: 15px;
      font-weight: 700;
      color: #e0f2fe;
      margin-bottom: 4px;
    }

    .viewer-info-card p {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 10px;
      font-size: 11px;
      color: #94a3b8;
    }

    .info-grid span strong {
      color: #f1f5f9;
      font-weight: 600;
    }

    /* Bottom Floating Toolbar */
    .viewer-toolbar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(12px);
      z-index: 12;
      max-width: calc(100% - 24px);
    }

    .tool-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.26);
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }

    .tool-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .tool-btn.active {
      background: rgba(14, 165, 233, 0.3);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .tool-sep {
      width: 1px;
      background: rgba(148, 163, 184, 0.25);
      margin: 2px 2px;
    }

    .viewer-hint {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.22);
      font-size: 11px;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 10;
    }

    .viewer-loading, .viewer-error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.45);
      font-size: 14px;
      font-weight: 600;
      z-index: 25;
      text-align: center;
      max-width: 85%;
    }

    .viewer-error {
      border-color: rgba(248, 113, 113, 0.6);
      color: #fecaca;
    }

    .viewer-drag-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 132, 199, 0.28);
      border: 3px dashed #38bdf8;
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      z-index: 50;
      pointer-events: none;
    }

    .viewer-drag-overlay.active {
      display: flex;
    }

    @media (max-width: 900px) {
      .viewer-title {
        font-size: 14px;
      }
      .mobile-only-btn {
        display: inline-flex;
      }
      .viewer-sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
      }
      .viewer-sidebar.open {
        transform: translateX(0);
      }
      .viewer-hint {
        display: none;
      }
      .viewer-info-card {
        max-width: 220px;
        padding: 9px 11px;
      }
      .viewer-toolbar {
        bottom: 10px;
        padding: 6px 8px;
      }
      .tool-sep {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="viewer-drag-overlay" class="viewer-drag-overlay">
    📦 여기에 .GLB / .GLTF 파일을 놓아 3D로 둘러보세요!
  </div>

  <div class="viewer-app">
    <header class="viewer-header">
      <div class="header-left">
        <button class="hdr-btn back" type="button" onclick="window.location.href='index.html'">⬅️ 게임으로</button>
        <button id="viewer-sidebar-toggle" class="hdr-btn mobile-only-btn" type="button">📋 모델 목록</button>
        <span class="viewer-title">📦 3D GLB 모델 갤러리 & 뷰어</span>
      </div>
      <div class="header-right">
        <input id="viewer-file-input" type="file" accept=".glb,.gltf" style="display:none;" />
        <button class="hdr-btn primary" type="button" onclick="document.getElementById('viewer-file-input').click()">📂 내 GLB 열기</button>
      </div>
    </header>

    <div class="viewer-main">
      <aside id="viewer-sidebar" class="viewer-sidebar">
        <div class="sidebar-controls">
          <input id="viewer-search-input" class="viewer-search" type="search" placeholder="모델 이름 검색 (예: b747, 인천, 해운대)..." />
          <div class="viewer-tabs">
            <button class="viewer-tab-btn active" type="button" data-filter="all">전체</button>
            <button class="viewer-tab-btn" type="button" data-filter="aircraft">✈️ 항공기</button>
            <button class="viewer-tab-btn" type="button" data-filter="environment">🌍 공항/환경</button>
          </div>
        </div>
        <div id="viewer-model-list" class="viewer-model-list"></div>
      </aside>

      <main id="viewer-canvas-wrap" class="viewer-canvas-wrap">
        <div class="viewer-info-card">
          <h2 id="info-model-name">📦 모델 로딩 중...</h2>
          <p id="info-model-desc">게임의 3D GLB 모델을 자유롭게 회전하고 확대해 보세요.</p>
          <div class="info-grid">
            <span>소스: <strong id="info-source">-</strong></span>
            <span>크기: <strong id="info-dimensions">-</strong></span>
            <span>메시: <strong id="info-meshes">-</strong></span>
            <span>폴리곤: <strong id="info-tris">-</strong></span>
            <span>정점: <strong id="info-verts">-</strong></span>
            <span>재질: <strong id="info-mats">-</strong></span>
          </div>
        </div>

        <div class="viewer-hint">
          드래그: 360° 회전 · 휠/핀치: 줌 인/아웃 · 우클릭 드래그: 이동 · 더블클릭: 초기화
        </div>

        <div id="viewer-loading" class="viewer-loading hidden">⏳ 3D 모델 불러오는 중...</div>
        <div id="viewer-error" class="viewer-error hidden"></div>

        <div class="viewer-toolbar">
          <button class="tool-btn" type="button" title="줌 인 (+)" onclick="window.glbViewer && window.glbViewer.zoomByFactor(0.8)">➕ 줌인</button>
          <button class="tool-btn" type="button" title="줌 아웃 (-)" onclick="window.glbViewer && window.glbViewer.zoomByFactor(1.25)">➖ 줌아웃</button>
          <div class="tool-sep"></div>
          <button class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.setPresetView('front')">정면</button>
          <button class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.setPresetView('side')">측면</button>
          <button class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.setPresetView('top')">상단</button>
          <button class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.setPresetView('quarter')">3/4뷰</button>
          <div class="tool-sep"></div>
          <button id="btn-auto-rotate" class="tool-btn active" type="button" title="자동 회전 (Space)" onclick="window.glbViewer && window.glbViewer.toggleAutoRotate()">🔄 자동회전</button>
          <button class="tool-btn" type="button" title="시점 초기화 (R)" onclick="window.glbViewer && window.glbViewer.resetView()">🎯 초기화</button>
          <button id="btn-wireframe" class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.toggleWireframe()">🔲 와이어</button>
          <button id="btn-grid" class="tool-btn active" type="button" onclick="window.glbViewer && window.glbViewer.toggleGrid()">📏 그리드</button>
          <button id="btn-theme" class="tool-btn" type="button" onclick="window.glbViewer && window.glbViewer.cycleTheme()">🌗 스튜디오</button>
          <button id="btn-anim-toggle" class="tool-btn hidden" type="button" onclick="window.glbViewer && window.glbViewer.toggleAnimation()">⏸️ 애니</button>
        </div>
      </main>
    </div>
  </div>

  <script src="glb_bundle.js?v=20261117i"></script>
  <script src="js/glb_pipeline.js?v=20261119e"></script>
  <script src="js/glb_viewer.js?v=20261117i"></script>
</body>
</html>
