name: flight_game_3d
description: "Sky Explorer 3D - 3D Airplane Game for Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/models/
    - assets/web/assets/models/
    - assets/web/index.html
    - assets/web/style.css
    - assets/web/glb_bundle.js
    - assets/web/game.js
